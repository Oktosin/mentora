spring.application.name=mentora

# Connection port
server.port=8080
server.servlet.context-path=/api

# ==========================================
# Database Configuration
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/mentora
spring.datasource.username=user_information
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# 4. Hibernate / JPA Settings Configuration
spring.jpa.hibernate.ddl-auto=update
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.validator.apply_to_ddl=false

# HikariCP Configuration For Large User Base With Many Concurrent Database Requests.
spring.datasource.hikari.maximum-pool-size=100
spring.datasource.hikari.minimum-idle=50
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.pool-name=mentora-HikariPool

# Security token settings. Override the secret with an environment-specific value before production use.
mentora.security.token-secret=change-this-secret-in-production
mentora.security.access-token-ttl-seconds=900
mentora.security.refresh-token-ttl-seconds=604800
